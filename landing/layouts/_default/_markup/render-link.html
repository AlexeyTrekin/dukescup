{{- /* Markdown links: open external http(s) links in a new tab. */ -}}
{{- $u := urls.Parse .Destination -}}
<a href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if in (slice "http" "https") $u.Scheme }} target="_blank" rel="noopener"{{ end -}}
>{{ .Text }}</a>
{{- /* chomp trailing newline */ -}}
